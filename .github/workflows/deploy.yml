name: Deploy AwraLink Website to Yegara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy React Website
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Get source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --working-dir=server --no-dev --prefer-dist --optimize-autoloader

      # 4. Build React website
      - name: Build React website
        run: npm run build

      - name: Include PHP dependencies
        run: cp -R server/vendor dist/vendor

      # 5. Test FTP connection to Yegara IP
      - name: Test Yegara FTP Connection
        run: |
          echo "Checking Yegara FTP port 21..."
          nc -zv -w 5 198.38.92.18 21

      # 6. Deploy website to Yegara
      - name: Deploy to Yegara using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 198.38.92.18
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./
