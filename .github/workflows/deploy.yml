
name: Deploy AwraLink Website to Yegara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy React Website
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Get source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React website
      - name: Build React website
        run: npm run build

      # 5. Test FTP DNS from GitHub servers
      - name: Test Yegara FTP DNS
        run: |
          echo "Checking Yegara FTP hostname..."
          nslookup ftp.awralink.com

      # 6. Deploy website to Yegara
      - name: Deploy to Yegara using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
