<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="AweraLink Technologies PLC logo">
  <title>AweraLink Technologies PLC</title>
  <desc>Network-node mark with AweraLink Technologies PLC wordmark</desc>
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1769FF" />
      <stop offset="100%" stop-color="#19C6D9" />
    </linearGradient>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1769FF" />
      <stop offset="100%" stop-color="#19C6D9" />
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(0, 12)">
    <rect x="0" y="0" width="96" height="96" rx="26" fill="url(#markGrad)" />
    <path d="M32 68 L64 32 L96 68" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95" />
    <circle cx="32" cy="68" r="5.4" fill="#FFFFFF" />
    <circle cx="64" cy="32" r="5.4" fill="#FFFFFF" />
    <circle cx="96" cy="68" r="5.4" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(118, 0)">
    <text x="0" y="62" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.02em" fill="#0B1F3A">
      Awera<span fill="url(#linkGrad)">Link</span>
    </text>
    <text x="0" y="96" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.32em" fill="#667085">
      TECHNOLOGIES&nbsp;PLC
    </text>
  </g>
</svg>